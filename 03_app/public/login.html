<style>
  :root { --paper: #FBF7F1; --grid: #EFE5D8; --ink: #2B2622; --soft: #7A6F64; --line: #ECE3D7; --accent: #C2603F; --accent-2: #E08A5F; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink);
         font: 15px/1.5 Inter, system-ui, "Segoe UI", sans-serif; background-color: var(--paper);
         background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
  .card { width: min(400px, 100%); background: #fff; border-radius: 20px; box-shadow: 0 18px 44px rgba(60,40,25,.14); padding: 30px 30px 24px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand img { width: 46px; height: 46px; border-radius: 12px; box-shadow: 0 3px 10px rgba(60,40,25,.18); }
  .brand b { font-size: 24px; letter-spacing: -.3px; }
  p.sub { color: var(--soft); margin: 0 0 18px; font-size: .9rem; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #F3EEE7; border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs button { border: 0; background: none; padding: 9px; border-radius: 9px; font: inherit; font-weight: 600; color: var(--soft); cursor: pointer; }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(60,40,25,.1); }
  label { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 12px 0 5px; }
  input { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 11px; font: inherit; background: #FDFBF8; }
  input:focus { outline: 2px solid rgba(194,96,63,.35); border-color: var(--accent); }
  .hint { font-size: .78rem; color: var(--soft); margin-top: 5px; }
  .go { width: 100%; margin-top: 20px; padding: 13px; border: 0; border-radius: 13px; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
        background: linear-gradient(135deg, var(--accent-2), var(--accent)); box-shadow: 0 10px 22px rgba(194,96,63,.3); }
  .msg { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; font-size: .88rem; }
  .msg.err { background: #FBE7E1; color: #8E3A22; } .msg.ok { background: #E7F0E5; color: #3E6B43; }
  .foot { margin-top: 18px; text-align: center; font-size: .8rem; color: var(--soft); } .foot a { color: var(--accent); }
</style>
</head>

<script>
  const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
  function setMode(m) {
    $("mode").value = m;
    $("tLogin").classList.toggle("on", m === "login"); $("tSignup").classList.toggle("on", m === "signup");
    $("go").textContent = m === "login" ? "Log in →" : "Create account →";
    $("hint").hidden = m === "login";
    $("password").autocomplete = m === "login" ? "current-password" : "new-password";

  $("tLogin").onclick = () => setMode("login");
  $("tSignup").onclick = () => setMode("signup");
  setMode(q.get("mode") === "signup" ? "signup" : "login");
  if (q.get("email")) $("email").value = q.get("email");
  const ERRORS = {
    wrong: "Wrong email or password.",
    exists: "There is already an account with this email. Log in instead.",
    short: "The password needs at least 8 characters.",
    email: "That does not look like an email address.",
    confirm: "Account made, but email confirmation is switched on in Supabase. Ask the team to switch it off, then log in.",
    busy: "Too many tries. Wait a few minutes and try again.",
    signup: "The account could not be made. Try another password.",
  };
  const err = q.get("error");
  if (err) { $("msg").textContent = ERRORS[err] || "Something went wrong."; $("msg").className = "msg err"; $("msg").hidden = false; }
  if (q.get("bye")) { $("msg").textContent = "You are logged out."; $("msg").className = "msg ok"; $("msg").hidden = false; }
</script>
</body>
</html>
